name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build single-file executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm ClaudeGuard.spec

      - name: Generate release manifest
        id: meta
        shell: pwsh
        run: |
          $initText = Get-Content -LiteralPath "guard/__init__.py" -Raw -Encoding UTF8
          if ($initText -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Failed to extract __version__ from guard/__init__.py"
          }
          $version = $Matches[1].Trim()
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Git tag '${{ github.ref_name }}' does not match guard/__init__.py version '$tag'"
          }
          $exePath = "dist/ClaudeGuard.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Missing built artifact: $exePath"
          }
          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $repo = "${{ github.repository }}"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/ClaudeGuard.exe"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"

          $tagBody = (git for-each-ref --format="%(contents)" "refs/tags/$tag" | Out-String).Trim()
          $genericTag = "Claude Guard $tag"
          if (-not $tagBody -or $tagBody -eq $genericTag -or $tagBody -eq $tag) {
            $prevTag = (git describe --tags --abbrev=0 "$tag^" 2>$null | Out-String).Trim()
            if ($prevTag) {
              $logLines = @(git log "$prevTag..HEAD" --no-merges --pretty="- %s")
            } else {
              $logLines = @(git log -5 --no-merges --pretty="- %s")
            }
            $tagBody = ($logLines | Where-Object { $_ -and $_.Trim() -ne "-" }) -join "`n"
          }
          if (-not $tagBody) {
            $tagBody = "- 常规维护与稳定性更新"
          }
          $notes = "Claude Guard $tag`n$tagBody"

          $manifest = [ordered]@{
            version     = $version
            tag         = $tag
            asset       = "ClaudeGuard.exe"
            sha256      = $sha256
            url         = $downloadUrl
            release_url = $releaseUrl
            notes       = $notes
          } | ConvertTo-Json -Depth 4

          $releaseBody = @(
            "### 本次更新内容"
            ""
            $tagBody
            ""
            "### 下载说明"
            "- 👉 **Windows 用户直接下载 ``ClaudeGuard.exe`` 运行即可**（单文件免安装，右键或以管理员身份运行可开启全部防泄漏加固功能）。"
            "- ℹ️ ``latest.json`` 为软件内置自动更新使用的校验清单，``Source code`` 为 GitHub 自动生成的源码归档，普通用户无需下载。"
            ""
            "---"
          ) -join "`n"

          $distDir = (Resolve-Path "dist").Path
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $distDir "latest.json"), $manifest, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $distDir "release_body.md"), $releaseBody, $utf8NoBom)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Claude Guard ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body_path: dist/release_body.md
          files: |
            dist/ClaudeGuard.exe
            dist/latest.json
